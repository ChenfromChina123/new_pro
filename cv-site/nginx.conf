# Nginx 配置文件 - cv.aistudy.icu 个人简历网站
# 将此配置添加到您的 nginx 配置目录中 (如 /etc/nginx/sites-available/)
# 并创建软链接到 sites-enabled 目录

server {
    listen 80;
    listen [::]:80;
    server_name cv.aistudy.icu;

    # 重定向到 HTTPS (可选，需要SSL证书)
    # return 301 https://$server_name$request_uri;

    # 网站根目录 - 请修改为实际路径
    root /var/www/cv-site;
    index index.html;

    # 日志文件
    access_log /var/log/nginx/cv.aistudy.icu.access.log;
    error_log /var/log/nginx/cv.aistudy.icu.error.log;

    # 主要位置配置
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

