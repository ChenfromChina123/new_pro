backend:
  name: github
  repo: ChenfromChina123/AiSpring
  branch: earthworm-deploy
  base_url: https://blog.aistudy.icu
  auth_endpoint: /api/admin/oauth/auth

locale: zh_Hans

local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts:
    - localhost
    - 127.0.0.1
publish_mode: editorial_workflow

media_folder: public/static/images
public_folder: /static/images

collections:
  - name: blog
    label: 博客文章（MDX）
    label_singular: 文章
    description: 该集合用于管理 MDX 文章，适合需要 JSX 组件能力的内容。
    folder: data/blog
    extension: mdx
    create: true
    slug: "{{slug}}"
    preview_path: blog/{{slug}}
    format: frontmatter
    fields:
      - { label: 标题, name: title, widget: string, required: true, hint: 页面显示的文章标题。 }
      - { label: 发布日期, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, required: true, hint: 文章发布日期，格式为 YYYY-MM-DD。 }
      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 用于文章分类和筛选，可填写多个标签。
        field: { label: 标签, name: tag, widget: string }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false, hint: 设为 true 时文章不会在站点公开展示。 }
      - { label: 摘要, name: summary, widget: text, required: false, hint: 列表页展示的简短说明，建议一到两句话。 }
      - { label: 最后修改日期, name: lastmod, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: 文章更新日期，未填写则默认使用发布日期。 }
      - label: 作者
        name: authors
        widget: list
        required: false
        default: ["default"]
        hint: 作者标识需对应 data/authors 下的文件名（不含扩展名）。
        field: { label: 作者标识, name: author, widget: string }
      - { label: 布局, name: layout, widget: select, required: false, options: ["PostLayout", "PostSimple", "PostBanner"], default: "PostLayout", hint: 文章详情页使用的展示布局。 }
      - { label: 正文, name: body, widget: markdown, required: true, hint: 支持 Markdown/MDX 语法，可直接编写正文内容。 }
  - name: blog_md
    label: 博客文章（MD，推荐）
    label_singular: 文章
    description: 该集合用于纯 Markdown 文章，支持在编辑器中直接插入图片。
    folder: data/blog
    extension: md
    create: true
    slug: "{{slug}}"
    preview_path: blog/{{slug}}
    format: frontmatter
    fields:
      - { label: 标题, name: title, widget: string, required: true, hint: 页面显示的文章标题。 }
      - { label: 发布日期, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false, required: true, hint: 文章发布日期，格式为 YYYY-MM-DD。 }
      - label: 标签
        name: tags
        widget: list
        required: false
        hint: 用于文章分类和筛选，可填写多个标签。
        field: { label: 标签, name: tag, widget: string }
      - { label: 草稿, name: draft, widget: boolean, default: false, required: false, hint: 设为 true 时文章不会在站点公开展示。 }
      - { label: 摘要, name: summary, widget: text, required: false, hint: 列表页展示的简短说明，建议一到两句话。 }
      - { label: 最后修改日期, name: lastmod, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: 文章更新日期，未填写则默认使用发布日期。 }
      - label: 作者
        name: authors
        widget: list
        required: false
        default: ["default"]
        hint: 作者标识需对应 data/authors 下的文件名（不含扩展名）。
        field: { label: 作者标识, name: author, widget: string }
      - { label: 布局, name: layout, widget: select, required: false, options: ["PostLayout", "PostSimple", "PostBanner"], default: "PostLayout", hint: 文章详情页使用的展示布局。 }
      - { label: 封面图, name: images, widget: list, required: false, hint: 可上传并插入一张或多张封面图。", field: { label: 图片, name: image, widget: image } }
      - { label: 正文, name: body, widget: markdown, required: true, hint: 可通过编辑器工具栏插入图片，图片路径会自动写入正文。 }
