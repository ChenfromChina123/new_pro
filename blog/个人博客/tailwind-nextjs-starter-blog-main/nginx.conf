# Nginx 配置文件 - blog.aistudy.icu 个人博客
# Next.js 博客项目部署配置

# 上游服务配置 (Next.js 应用)
upstream blog_backend {
    server 127.0.0.1:3200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.aistudy.icu;

    # 重定向到 HTTPS (可选，需要SSL证书)
    # return 301 https://$server_name$request_uri;

    # 日志文件
    access_log /var/log/nginx/blog.aistudy.icu.access.log;
    error_log /var/log/nginx/blog.aistudy.icu.error.log;

    # 客户端请求配置
    client_max_body_size 50M;

    # 主要位置配置 - 代理到 Next.js 应用
    location / {
        proxy_pass http://blog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Next.js 静态资源
    location /_next/static {
        proxy_pass http://blog_backend;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://blog_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

